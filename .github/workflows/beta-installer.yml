name: Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/beta-installer.yml'
      - 'release/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'Anamnesis.sln'
  pull_request:
    paths:
      - '.github/workflows/beta-installer.yml'
      - 'release/**'
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'Anamnesis.sln'

permissions:
  contents: read

jobs:
  validar-instalador:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      canal: ${{ steps.versao.outputs.canal }}
      tag: ${{ steps.versao.outputs.tag }}
      artifact: ${{ steps.versao.outputs.artifact }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolver versao canonica
        id: versao
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versao = & .\scripts\Obter-VersaoRelease.ps1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $versao.Tag) {
            throw "A tag $env:GITHUB_REF_NAME diverge da tag esperada $($versao.Tag)."
          }
          $artifact = "candidato-anamnesis-$($versao.Versao)-$env:GITHUB_RUN_ID"
          "ANAMNESIS_VERSION=$($versao.Versao)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANAMNESIS_NUMERIC_VERSION=$($versao.VersaoNumerica)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANAMNESIS_PREVIOUS_VERSION=$($versao.VersaoAnteriorParaSmoke)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "ANAMNESIS_PREVIOUS_NUMERIC_VERSION=$($versao.VersaoNumericaAnteriorParaSmoke)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "versao=$($versao.Versao)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "canal=$($versao.Canal)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tag=$($versao.Tag)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact=$artifact" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Restaurar dependencias
        shell: pwsh
        run: dotnet restore Anamnesis.sln --runtime win-x64 --verbosity minimal

      - name: Executar testes Release
        shell: pwsh
        run: dotnet test Anamnesis.sln --configuration Release --no-restore --verbosity minimal

      - name: Baixar release anterior oficial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $anterior = & .\scripts\Obter-InstaladorAnterior.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'anamnesis-release-anterior')
          "ANAMNESIS_PREVIOUS_INSTALLER=$anterior" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Instalar Inno Setup verificado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = & .\scripts\Instalar-InnoSetup.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'inno-setup')
          "INNO_ISCC=$iscc" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Construir instalador canonico
        shell: pwsh
        run: |
          .\scripts\Build-Installer.ps1 `
            -OutputRoot (Join-Path $env:RUNNER_TEMP "anamnesis-release\$env:ANAMNESIS_VERSION") `
            -IsccPath $env:INNO_ISCC

      - name: Construir probe efemero de downgrade
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = .\scripts\Build-DowngradeProbe.ps1 `
            -CanonicalOutputRoot (Join-Path $env:RUNNER_TEMP "anamnesis-release\$env:ANAMNESIS_VERSION") `
            -Version '0.0.1-downgrade-probe' `
            -NumericVersion '0.0.1.0' `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'anamnesis-downgrade-probe') `
            -IsccPath $env:INNO_ISCC
          "ANAMNESIS_DOWNGRADE_INSTALLER=$probe" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Validar instalacao, atualizacao e desinstalacao
        shell: pwsh
        run: |
          .\scripts\Test-Installer.ps1 `
            -InstallerPath $env:ANAMNESIS_PREVIOUS_INSTALLER `
            -UpdateInstallerPath (Join-Path $env:RUNNER_TEMP "anamnesis-release\$env:ANAMNESIS_VERSION\installer\Anamnesis-$env:ANAMNESIS_VERSION-win-x64-setup.exe") `
            -DowngradeInstallerPath $env:ANAMNESIS_DOWNGRADE_INSTALLER `
            -ExpectedInitialVersion $env:ANAMNESIS_PREVIOUS_VERSION `
            -ExpectedInitialNumericVersion $env:ANAMNESIS_PREVIOUS_NUMERIC_VERSION `
            -ExpectedUpdateVersion $env:ANAMNESIS_VERSION `
            -ExpectedUpdateNumericVersion $env:ANAMNESIS_NUMERIC_VERSION `
            -EvidenceRoot (Join-Path $env:RUNNER_TEMP 'installer-e2e')

      - name: Publicar candidato e evidencias
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.versao.outputs.artifact }}
          path: |
            ${{ runner.temp }}\anamnesis-release\${{ env.ANAMNESIS_VERSION }}\installer\*
            ${{ runner.temp }}\installer-e2e\**
          if-no-files-found: error
          retention-days: 30

      - name: Publicar diagnostico da falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anamnesis-diagnostico-falha-${{ github.run_id }}
          path: ${{ runner.temp }}\installer-e2e\**
          if-no-files-found: warn
          retention-days: 14

  publicar-release-github:
    needs: validar-instalador
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Baixar candidato aprovado pelo smoke
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: ${{ needs.validar-instalador.outputs.artifact }}
          path: pacote

      - name: Validar manifesto e ausencia de release anterior
        id: pacote
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANAMNESIS_VERSION: ${{ needs.validar-instalador.outputs.versao }}
          ANAMNESIS_TAG: ${{ needs.validar-instalador.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = @(Get-ChildItem pacote -Recurse -File -Filter "Anamnesis-$env:ANAMNESIS_VERSION-win-x64-setup.exe")
          $somas = @(Get-ChildItem pacote -Recurse -File -Filter 'SHA256SUMS.txt')
          $manifestos = @(Get-ChildItem pacote -Recurse -File -Filter 'release.json')
          if ($exe.Count -ne 1 -or $somas.Count -ne 1 -or $manifestos.Count -ne 1) {
            throw 'O candidato nao contem exatamente um EXE, um SHA256SUMS.txt e um release.json.'
          }

          $manifesto = Get-Content -LiteralPath $manifestos[0].FullName -Raw | ConvertFrom-Json
          $hash = (Get-FileHash -LiteralPath $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $linhaSomas = (Get-Content -LiteralPath $somas[0].FullName -Raw).Trim()
          if ($manifesto.versao -ne $env:ANAMNESIS_VERSION -or
              $manifesto.tagEsperada -ne $env:ANAMNESIS_TAG -or
              $manifesto.commit -ne $env:GITHUB_SHA -or
              $manifesto.arvoreDeTrabalhoLimpa -ne $true -or
              $manifesto.sha256 -ne $hash -or
              $linhaSomas -ne "$hash  $($exe[0].Name)") {
            throw 'O manifesto nao vincula corretamente versao, tag, commit, arvore limpa e hash.'
          }

          $releasesExistentes = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Nao foi possivel listar as releases antes da promocao.'
          }
          $tagsExistentes = @($releasesExistentes | ForEach-Object { $_.tagName })
          if ($tagsExistentes -contains $env:ANAMNESIS_TAG) {
            throw "A release $env:ANAMNESIS_TAG ja existe e nao sera sobrescrita."
          }

          "exe=$($exe[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "somas=$($somas[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "manifesto=$($manifestos[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Promover release imutavel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ANAMNESIS_VERSION: ${{ needs.validar-instalador.outputs.versao }}
          ANAMNESIS_CHANNEL: ${{ needs.validar-instalador.outputs.canal }}
          ANAMNESIS_TAG: ${{ needs.validar-instalador.outputs.tag }}
          EXE: ${{ steps.pacote.outputs.exe }}
          SOMAS: ${{ steps.pacote.outputs.somas }}
          MANIFESTO: ${{ steps.pacote.outputs.manifesto }}
        run: |
          $ErrorActionPreference = 'Stop'
          $argumentos = @(
            $env:ANAMNESIS_TAG,
            $env:EXE, $env:SOMAS, $env:MANIFESTO,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--latest=false',
            '--title', "Anamnesis $env:ANAMNESIS_VERSION",
            '--notes', "Instalador Windows aprovado pelo smoke instalado da execucao $env:GITHUB_RUN_ID."
          )
          if ($env:ANAMNESIS_CHANNEL -ne 'estavel') {
            gh release create @argumentos --prerelease
          }
          else {
            gh release create @argumentos
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'A criacao da release falhou.'
          }

          $release = gh release view $env:ANAMNESIS_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isImmutable | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Nao foi possivel confirmar a imutabilidade da release publicada.'
          }
          if (-not $release.isImmutable) {
            gh release delete $env:ANAMNESIS_TAG --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) {
              throw 'A release foi publicada mutavel e a compensacao automatica falhou. Intervencao imediata necessaria.'
            }

            gh release view $env:ANAMNESIS_TAG --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              throw 'A release mutavel continuou visivel depois da compensacao automatica.'
            }

            throw 'A release mutavel foi removida automaticamente. A tag foi preservada e a promocao deve ser repetida somente depois de reativar Immutable releases.'
          }

          $verificada = $false
          for ($tentativa = 1; $tentativa -le 5 -and -not $verificada; $tentativa++) {
            gh release verify $env:ANAMNESIS_TAG --repo $env:GITHUB_REPOSITORY
            $verificada = $LASTEXITCODE -eq 0
            if (-not $verificada) {
              Start-Sleep -Seconds 3
            }
          }
          if (-not $verificada) {
            throw 'O atestado da release imutavel nao foi confirmado.'
          }

          gh release verify-asset $env:ANAMNESIS_TAG $env:EXE --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'O EXE publicado diverge do candidato.' }
          gh release verify-asset $env:ANAMNESIS_TAG $env:SOMAS --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'O arquivo de hashes publicado diverge do candidato.' }
          gh release verify-asset $env:ANAMNESIS_TAG $env:MANIFESTO --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'O manifesto publicado diverge do candidato.' }
